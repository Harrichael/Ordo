[package]
name = "ordo"
version = "0.1.0"
edition = "2021"

[dependencies]
ordo-core = { path = "../ordo-core" }
ordo-skylight-sys = { path = "../ordo-skylight-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSValue",
    "NSGeometry",
    "NSEnumerator",
    "NSRunLoop",
    "NSThread",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSScreen",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFArray",
    "CFDictionary",
    "CFString",
    "CFNumber",
    "CFRunLoop",
    "CFDate",
    "CFUUID",
    "CFMachPort",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGWindow",
    "CGDirectDisplay",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGError",
    "CGDisplayConfiguration",
] }
objc2-application-services = { version = "0.3", features = [
    "AXUIElement",
    "AXValue",
    "AXValueConstants",
    "AXError",
    "AXAttributeConstants",
    "AXActionConstants",
    "AXNotificationConstants",
    "HIServices",
] }
